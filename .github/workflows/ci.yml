name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly link check, Monday 06:17 UTC
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Unit and content tests
        run: node --test test/*.test.mjs
      - name: Review pack is up to date
        run: node scripts/export-content.mjs --check
  links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every source URL still resolves
        run: node scripts/check-links.mjs
